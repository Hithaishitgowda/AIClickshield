<!DOCTYPE html>
<html>
<head>
  <title>Overlay Div Clickjacking</title>
  <style>
    .container { position: relative; width: 300px; height: 100px; margin: 100px auto; }
    #realButton {
      width: 300px; height: 100px; font-size: 24px;
      background: #2196F3; color: white; border: none; border-radius: 8px; z-index: 1; position: absolute; top: 0; left: 0;
    }
    #overlayDiv {
      position: absolute; top: 0; left: 0; width: 300px; height: 100px;
      background: #fff; opacity: 0.01; z-index: 2; pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="realButton" onclick="alert('You clicked the visible button!')">Click Me!</button>
    <div id="overlayDiv" onclick="alert('You clicked the hidden overlay!')"></div>
  </div>
</body>
</html>
