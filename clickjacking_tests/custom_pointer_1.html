<!DOCTYPE html>
<html>
<head>
  <title>Pointer Events - Hidden Trap</title>
  <style>
    .wrap {
      position: relative; width: 340px; height: 100px; margin: 120px auto;
    }
    .safe-btn {
      width: 100%; height: 100%; font-size: 24px;
      background: #795548; color: white; border-radius: 10px;
      z-index: 1; position: absolute;
    }
    .click-trap {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.01);
      z-index: 2; pointer-events: auto;
    }
    .top-cover {
      position: absolute; width: 100%; height: 100%;
      background: transparent; z-index: 3; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="safe-btn" onclick="alert('✔️ Legitimate click')">Confirm</button>
    <div class="click-trap" onclick="alert('🚨 Clicked hidden trap!')"></div>
    <div class="top-cover"></div>
  </div>
</body>
</html>
