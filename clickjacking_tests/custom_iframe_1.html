<!DOCTYPE html>
<html>
<head>
  <title>Clickjacking: Transparent iframe with emoji</title>
  <style>
    .trapbox {
      position: relative;
      width: 320px;
      height: 90px;
      margin: 100px auto;
    }
    .bait {
      width: 320px;
      height: 90px;
      font-size: 26px;
      background: #ff5722;
      color: #fff;
      border-radius: 12px;
      z-index: 1;
      position: absolute;
    }
    .trap {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 90px;
      opacity: 0.01;
      z-index: 2;
      border: none;
    }
  </style>
</head>
<body>
  <div class="trapbox">
    <button class="bait" onclick="alert('😄 Legitimate Click!')">Donate</button>
    <iframe class="trap" srcdoc="<button onclick='alert(&quot;💀 Malicious Trap Click!&quot;)' style='width:100%;height:100%;font-size:26px;'>Trap</button>"></iframe>
  </div>
</body>
</html>
