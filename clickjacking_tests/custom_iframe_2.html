<!DOCTYPE html>
<html>
<head>
  <title>Click Trap Over Video</title>
  <style>
    .wrapper {
      position: relative;
      width: 640px;
      height: 360px;
      margin: 80px auto;
    }
    .trap-iframe {
      position: absolute;
      width: 640px;
      height: 360px;
      opacity: 0.01;
      z-index: 2;
      border: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <video width="640" height="360" controls autoplay muted>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
    <iframe class="trap-iframe" srcdoc="<button onclick='alert(&quot;You clicked a trap during the video!&quot;)' style='width:100%;height:100%;font-size:22px;'>Trap</button>"></iframe>
  </div>
</body>
</html>
