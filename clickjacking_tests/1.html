<!DOCTYPE html>
<html>
<head>
  <title>Minimal Clickjacking Demo</title>
  <style>
    #victim {
      width: 300px; height: 100px;
      background: #4CAF50; color: #fff;
      font-size: 24px; border: none; border-radius: 8px;
      position: relative; z-index: 1;
    }
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 300px; height: 100px;
      opacity: 0.01; z-index: 2; pointer-events: auto;
      border: none;
    }
    .container { position: relative; width: 300px; height: 100px; margin: 100px auto; }
  </style>
</head>
<body>
  <div class="container">
    <button id="victim" onclick="alert('You clicked the visible button!')">Click Me!</button>
    <iframe id="overlay" srcdoc="<button onclick='alert(&quot;You clicked the hidden trap!&quot;)' style='width:300px;height:100px;font-size:24px;'>Hidden Trap</button>"></iframe>
  </div>
</body>
</html>
