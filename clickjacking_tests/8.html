<!DOCTYPE html>
<html>
<head>
  <title>Animated Trap Clickjacking</title>
  <style>
    .container { position: relative; width: 350px; height: 120px; margin: 100px auto; }
    #realButton {
      width: 350px; height: 120px; font-size: 28px;
      background: #009688; color: white; border: none; border-radius: 8px; z-index: 1; position: absolute; top: 0; left: 0;
    }
    #trapDiv {
      position: absolute; top: -150px; left: 0; width: 350px; height: 120px;
      background: #fff; opacity: 0.01; z-index: 2; pointer-events: auto;
      animation: slideDown 2s forwards 1.5s;
    }
    @keyframes slideDown {
      to { top: 0; }
    }
  </style>
  <script>
    function trapClick() {
      alert('You clicked the animated hidden trap!');
    }
  </script>
</head>
<body>
  <div class="container">
    <button id="realButton" onclick="alert('You clicked the visible button!')">Click Me!</button>
    <div id="trapDiv" onclick="trapClick()"></div>
  </div>
</body>
</html>
