<!DOCTYPE html>
<html>
<head>
  <title>Two-Click Activation</title>
  <style>
    .container {
      position: relative; width: 300px; height: 100px;
      margin: 120px auto;
    }
    #stepOne {
      width: 100%; height: 100%;
      font-size: 22px; background: #f44336; color: white;
      border: none; border-radius: 8px; z-index: 1;
    }
    #stepTrap {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3); z-index: 2;
      pointer-events: auto; display: none;
    }
  </style>
  <script>
    function firstClick() {
      alert('Click again to confirm!');
      document.getElementById("stepTrap").style.display = "block";
    }
    function trapClick() {
      alert("🚨 Trap clicked after 1st click!");
    }
  </script>
</head>
<body>
  <div class="container">
    <button id="stepOne" onclick="firstClick()">Delete</button>
    <div id="stepTrap" onclick="trapClick()"></div>
  </div>
</body>
</html>
